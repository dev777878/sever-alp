<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Градиент для буквы А -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a87;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Буква А -->
  <path d="M 60 180 L 100 40 L 140 180 L 120 180 L 100 110 L 80 180 Z" 
        fill="url(#letterGradient)" 
        stroke="#1e3a5f" 
        stroke-width="2"/>
  
  <!-- Альпинист (группа для анимации) -->
  <g id="climber">
    <!-- Тело -->
    <circle cx="95" cy="70" r="8" fill="#ff6b35"/>
    <path d="M 95 78 L 95 100 L 85 115 M 95 100 L 105 115" 
          stroke="#1e3a5f" 
          stroke-width="3" 
          fill="none" 
          stroke-linecap="round"/>
    <!-- Руки -->
    <path d="M 95 85 L 85 95 M 95 85 L 105 90" 
          stroke="#1e3a5f" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round"
          class="arm"/>
    <!-- Ноги -->
    <path d="M 95 100 L 88 110 M 95 100 L 102 110" 
          stroke="#1e3a5f" 
          stroke-width="2.5" 
          fill="none" 
          stroke-linecap="round"
          class="leg"/>
  </g>
  
  <!-- Карабин -->
  <ellipse cx="115" cy="130" rx="12" ry="18" 
           fill="none" 
           stroke="#1e3a5f" 
           stroke-width="3"
           transform="rotate(-30 115 130)"/>
  
  <!-- Анимация движения альпиниста -->
  <style>
    #climber {
      animation: climbUp 4s ease-in-out infinite;
      transform-origin: center;
    }
    
    .arm {
      animation: wave 4s ease-in-out infinite;
      transform-origin: 95px 85px;
    }
    
    @keyframes climbUp {
      0%, 100% {
        transform: translate(0, 40px);
      }
      40% {
        transform: translate(0, -10px);
      }
      50% {
        transform: translate(0, -10px);
      }
      60% {
        transform: translate(0, -10px);
      }
      90% {
        transform: translate(0, 40px);
      }
    }
    
    @keyframes wave {
      0%, 40%, 60%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-30deg);
      }
    }
  </style>
</svg>
